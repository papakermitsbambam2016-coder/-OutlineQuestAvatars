name: Build Outline Quest Flight DLL

on:
  workflow_dispatch:
  push:
    paths:
      - "FlightMod/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Check required DLL references
        shell: bash
        run: |
          required=(
            MelonLoader.dll
            Il2CppInterop.Runtime.dll
            UnityEngine.CoreModule.dll
            UnityEngine.PhysicsModule.dll
            UnityEngine.InputLegacyModule.dll
            UnityEngine.XRModule.dll
          )

          for file in "${required[@]}"; do
            if [ ! -f "FlightMod/References/$file" ]; then
              echo "Missing FlightMod/References/$file"
              exit 1
            fi
          done

      - name: Build flight mod
        run: |
          dotnet build FlightMod/OutlineQuestFlight.csproj \
            --configuration Release

      - name: Upload finished DLL
        uses: actions/upload-artifact@v4
        with:
          name: OutlineQuestFlight-DLL
          path: FlightMod/bin/Release/OutlineQuestFlight.dll
          if-no-files-found: error
