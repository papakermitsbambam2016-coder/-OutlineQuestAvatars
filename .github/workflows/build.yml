  - name: Check required DLL references
        shell: bash
        run: |
          required=(
            UnityEngine.CoreModule.dll
            UnityEngine.PhysicsModule.dll
            UnityEngine.InputLegacyModule.dll
            UnityEngine.XRModule.dll
          )

          for file in "${required[@]}"; do
            if [ ! -f "FlightMod/References/$file" ]; then
              echo "Missing FlightMod/References/$file"
              exit 1
            fi
          done
